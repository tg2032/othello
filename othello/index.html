<!DOCTYPE html>
<html lang="ja" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="ブラウザで遊べるオセロ。スマホ・タブレットのタッチ操作に対応。">
<meta property="og:type" content="website">
<meta property="og:title" content="オセロ — ブラウザで遊べるリバーシ">
<meta property="og:description" content="スマホのタッチ操作対応。CPU戦（3段階）と2人対戦。">
<meta property="og:image" content="icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="オセロ — ブラウザで遊べるリバーシ">
<meta name="twitter:description" content="スマホのタッチ操作対応。CPU戦（3段階）と2人対戦。">
<meta name="twitter:image" content="icon-512.png">
<title>オセロ</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="オセロ">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" role="application" aria-label="オセロ">

  <header class="topbar">
    <h1>オセロ</h1>
    <div class="topbar-right">
      <span class="status" id="status" role="status" aria-live="polite">黒の番</span>
      <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="サウンドの切り替え">🔊</button>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="設定">⚙</button>
    </div>
  </header>

  <section class="scoreboard" aria-label="スコア">
    <div class="score active" id="scoreBlack">
      <span class="mini mini-black" aria-hidden="true"></span>
      <span class="score-name" id="blackName">黒</span>
      <b id="countBlack">2</b>
    </div>
    <div class="score" id="scoreWhite">
      <b id="countWhite">2</b>
      <span class="score-name" id="whiteName">白</span>
      <span class="mini mini-white" aria-hidden="true"></span>
    </div>
  </section>

  <main class="board-frame" id="boardFrame">
    <div class="board-wrap">
      <div class="corner" aria-hidden="true"></div>
      <div class="col-labels" aria-hidden="true">
        <span>A</span><span>B</span><span>C</span><span>D</span>
        <span>E</span><span>F</span><span>G</span><span>H</span>
      </div>
      <div class="row-labels" aria-hidden="true">
        <span>1</span><span>2</span><span>3</span><span>4</span>
        <span>5</span><span>6</span><span>7</span><span>8</span>
      </div>
      <div class="board" id="board" role="group" aria-label="オセロの盤面" tabindex="-1"></div>
    </div>
  </main>

  <!-- Review bar: shown when reviewing past moves -->
  <section class="review-bar" id="reviewBar" hidden aria-label="局面レビュー">
    <button type="button" class="btn" id="reviewPrev" aria-label="前の手">◀</button>
    <span class="review-info" id="reviewInfo">レビュー中</span>
    <button type="button" class="btn" id="reviewNext" aria-label="次の手">▶</button>
    <button type="button" class="btn" id="reviewLive" aria-label="最新局面へ">ライブへ</button>
  </section>

  <section class="controls">
    <div class="segmented" role="group" aria-label="プレイモード">
      <button type="button" data-mode="pvp">2人対戦</button>
      <button type="button" data-mode="ai" class="selected">CPU戦</button>
    </div>

    <label class="select-wrap">
      <span class="sr-only">難易度</span>
      <select id="levelSelect" aria-label="難易度">
        <option value="easy">やさしい</option>
        <option value="normal" selected>ふつう</option>
        <option value="hard">むずかしい</option>
      </select>
    </label>

    <button type="button" class="btn" id="undoBtn" disabled>戻る</button>
    <button type="button" class="btn" id="kifuBtn" aria-label="譜面を開く">譜面</button>
    <button type="button" class="btn btn-primary" id="newBtn">新しいゲーム</button>
  </section>

  <p class="footnote" id="footnote">あなたは黒（先手）です。白丸のマスが置ける場所です。</p>
</div>

<!-- Move list (kifu) drawer -->
<section class="drawer" id="kifuDrawer" hidden aria-label="譜面">
  <header class="drawer-header">
    <h2>譜面</h2>
    <button type="button" class="icon-btn" id="kifuClose" aria-label="閉じる">✕</button>
  </header>
  <ul class="kifu-list" id="kifuList" role="list"></ul>
</section>

<!-- Settings sheet -->
<section class="sheet" id="settingsSheet" hidden aria-label="設定">
  <header class="sheet-header">
    <h2>設定</h2>
    <button type="button" class="icon-btn" id="sheetClose" aria-label="閉じる">✕</button>
  </header>

  <div class="sheet-section">
    <h3>対局</h3>
    <div class="setting-row">
      <span class="setting-label" id="levelLabel">難易度</span>
      <div class="segmented" role="group" aria-labelledby="levelLabel">
        <button type="button" data-level="easy">やさしい</button>
        <button type="button" data-level="normal" class="selected">ふつう</button>
        <button type="button" data-level="hard">むずかしい</button>
      </div>
    </div>
    <div class="setting-row" id="colorRow">
      <span class="setting-label" id="colorLabel">あなた</span>
      <div class="segmented" role="group" aria-labelledby="colorLabel">
        <button type="button" data-color="1" class="selected">黒（先手）</button>
        <button type="button" data-color="2">白（後手）</button>
      </div>
    </div>
  </div>

  <div class="sheet-section">
    <h3>見た目</h3>
    <div class="setting-row">
      <span class="setting-label">盤面テーマ</span>
      <select id="themeSelect" aria-label="盤面テーマ">
        <option value="midnight">ミッドナイト</option>
        <option value="classic">クラシック</option>
        <option value="wood">ウッド</option>
      </select>
    </div>
  </div>

  <div class="sheet-section">
    <h3>サウンド</h3>
    <div class="setting-row toggle-row">
      <span class="setting-label">効果音</span>
      <button type="button" class="toggle" id="soundToggle" aria-checked="true" role="switch" aria-label="効果音">
        <span class="toggle-track"></span><span class="toggle-thumb"></span>
      </button>
    </div>
  </div>

  <div class="sheet-section">
    <h3>レコード <button type="button" class="btn btn-ghost" id="statsReset">リセット</button></h3>
    <div class="stats-row">
      <div class="stat"><b id="statWin">0</b><span>勝</span></div>
      <div class="stat"><b id="statLoss">0</b><span>敗</span></div>
      <div class="stat"><b id="statDraw">0</b><span>分</span></div>
    </div>
    <p class="stat-note" id="statRate">勝率 —</p>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <h2 id="resultTitle">ゲーム終了</h2>
    <p id="resultText"></p>
    <div class="result-score" id="resultScore"></div>
    <div class="dialog-buttons">
      <button type="button" class="btn" id="reviewBtn">盤面を見直す</button>
      <button type="button" class="btn btn-primary" id="againBtn">もう一度遊ぶ</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
<script src="ui.js"></script>
<script>
/* Offline support: caches the app shell after first load (http/https only). */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () { /* offline N/A */ });
  });
}
</script>
</body>
</html>
